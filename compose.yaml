name: naryadai
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: naryadai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: naryadai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naryadai -d naryadai"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://naryadai:${POSTGRES_PASSWORD}@db:5432/naryadai
      WORKER_ENABLED: "false"
      UPLOAD_DIR: /app/storage/photos
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - photos:/app/storage/photos
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://naryadai:${POSTGRES_PASSWORD}@db:5432/naryadai
      WORKER_ENABLED: "false"
      UPLOAD_DIR: /app/storage/photos
    volumes:
      - photos:/app/storage/photos
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  photos:
